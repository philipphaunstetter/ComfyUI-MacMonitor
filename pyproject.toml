[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-macmonitor"
version = "0.1.0"
description = "Live system performance monitor (CPU, RAM, MPS VRAM, generation time) for ComfyUI on Apple Silicon."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "newflow" }]
keywords = ["comfyui", "mps", "apple-silicon", "monitoring", "performance"]
classifiers = [
  "Environment :: GPU",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "psutil>=5.9",
]

[project.optional-dependencies]
gpu = ["pyobjc-framework-Cocoa"]

[project.urls]
Repository = "https://github.com/philipphaunstetter/ComfyUI-MacMonitor"
Issues = "https://github.com/philipphaunstetter/ComfyUI-MacMonitor/issues"

[tool.comfy]
PublisherId = "philipphaunstetter"
DisplayName = "MacMonitor"
Icon = ""
